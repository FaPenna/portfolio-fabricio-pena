<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IA para Devs — Plataforma de Estudos</title>
<meta name="description" content="Plataforma pessoal e gratuita de estudos em Inteligência Artificial para Desenvolvedores: trilha completa, do zero ao avançado.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='%230b0c10'/%3E%3Ccircle cx='50' cy='28' r='10' fill='url(%23g)'/%3E%3Ccircle cx='26' cy='70' r='10' fill='url(%23g)' opacity='0.8'/%3E%3Ccircle cx='74' cy='70' r='10' fill='url(%23g)' opacity='0.8'/%3E%3Cline x1='50' y1='28' x2='26' y2='70' stroke='url(%23g)' stroke-width='4'/%3E%3Cline x1='50' y1='28' x2='74' y2='70' stroke='url(%23g)' stroke-width='4'/%3E%3Cline x1='26' y1='70' x2='74' y2='70' stroke='url(%23g)' stroke-width='4'/%3E%3C/svg%3E">
<style>
/* ============================================================
   0. RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
:root{
  --bg: #08090c;
  --bg-elevated: #0d0f14;
  --bg-elevated-2: #12141b;
  --surface: rgba(255,255,255,0.04);
  --surface-hover: rgba(255,255,255,0.075);
  --surface-solid: #14161d;
  --border: rgba(255,255,255,0.09);
  --border-strong: rgba(255,255,255,0.16);
  --text: #f3f4f6;
  --text-secondary: #a2a7b3;
  --text-tertiary: #6d7280;
  --accent-1: #7c5cff;
  --accent-2: #22d3ee;
  --accent-3: #ff7a59;
  --accent-grad: linear-gradient(135deg, var(--accent-1), var(--accent-2));
  --accent-grad-2: linear-gradient(135deg, #a78bfa, #22d3ee);
  --success: #34d399;
  --warning: #fbbf24;
  --danger: #f87171;
  --info: #60a5fa;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --shadow-sm: 0 2px 8px rgba(0,0,0,0.25);
  --shadow-md: 0 8px 30px rgba(0,0,0,0.35);
  --shadow-lg: 0 20px 60px rgba(0,0,0,0.5);
  --font-sans: 'Segoe UI', ui-sans-serif, system-ui, -apple-system, Inter, Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'Cascadia Code', ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
  --sidebar-w: 288px;
  --sidebar-w-collapsed: 84px;
  --topbar-h: 68px;
  --ease: cubic-bezier(.22,1,.36,1);
  --mx: 50%;
  --my: 50%;
}
:root[data-theme="light"]{
  --bg: #f6f6fb;
  --bg-elevated: #ffffff;
  --bg-elevated-2: #f0f1f6;
  --surface: rgba(20,20,40,0.035);
  --surface-hover: rgba(20,20,40,0.065);
  --surface-solid: #ffffff;
  --border: rgba(20,20,40,0.10);
  --border-strong: rgba(20,20,40,0.18);
  --text: #14151d;
  --text-secondary: #4c4e59;
  --text-tertiary: #7c7e8a;
  --shadow-sm: 0 2px 10px rgba(20,20,40,0.06);
  --shadow-md: 0 10px 30px rgba(20,20,40,0.10);
  --shadow-lg: 0 24px 60px rgba(20,20,40,0.16);
}
[data-theme="light"] ::selection{ background: rgba(124,92,255,0.25); color: #14151d; }
[data-theme="light"] ::-webkit-scrollbar-thumb{ background: rgba(20,20,40,0.16); }
[data-theme="light"] ::-webkit-scrollbar-thumb:hover{ background: rgba(20,20,40,0.28); }
[data-theme="light"] *{ scrollbar-color: rgba(20,20,40,0.2) transparent; }
[data-theme="light"] #particles-canvas{ opacity: 0.32; }
[data-theme="light"] .bg-blobs span{ opacity: 0.12; }
[data-theme="light"] .sidebar{ background: rgba(255,255,255,0.78); }
[data-theme="light"] .topbar{ background: rgba(255,255,255,0.62); }
[data-theme="light"] .mobile-topbar{ background: rgba(255,255,255,0.85); }
[data-theme="light"] .cmdk{ background: rgba(255,255,255,0.97); }
[data-theme="light"] .simple-modal{ background: rgba(255,255,255,0.98); }
[data-theme="light"] .toast{ background: rgba(255,255,255,0.98); }
[data-theme="light"] .sidebar-search kbd{ background: rgba(20,20,40,0.08); }
[data-theme="light"] .nav-link .badge-mini{ background: rgba(20,20,40,0.08); }
[data-theme="light"] .profile-info .xp-bar-mini{ background: rgba(20,20,40,0.08); }
[data-theme="light"] .card{ background: linear-gradient(180deg, rgba(20,20,40,0.035), rgba(20,20,40,0.012)); }
[data-theme="light"] .badge-neutral{ background: rgba(20,20,40,0.07); }
[data-theme="light"] .progress{ background: rgba(20,20,40,0.08); }
[data-theme="light"] .ring::before{ background: conic-gradient(var(--accent-1) calc(var(--pct,0)*1%), rgba(20,20,40,0.08) 0); }
[data-theme="light"] .stat-tile{ background: linear-gradient(160deg, rgba(20,20,40,0.04), rgba(20,20,40,0.012)); }
[data-theme="light"] .heatmap .cell{ background: rgba(20,20,40,0.07); }
[data-theme="light"] .roadmap-node.locked .rn-num{ background: rgba(20,20,40,0.08); }
[data-theme="light"] .md-code{ background: rgba(20,20,40,0.08); }
[data-font="lg"]{ font-size: 17px; }
[data-font="sm"]{ font-size: 14.5px; }
body{
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100vh;
}
img, svg{ display:block; max-width:100%; }
a{ color: inherit; text-decoration: none; }
ul, ol{ list-style: none; }
button, input, textarea, select{ font: inherit; color: inherit; background: none; border: none; outline: none; }
button{ cursor: pointer; }
h1,h2,h3,h4,h5{ font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
::selection{ background: rgba(124,92,255,0.35); color: #fff; }
::-webkit-scrollbar{ width: 10px; height: 10px; }
::-webkit-scrollbar-track{ background: transparent; }
::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.12); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover{ background: rgba(255,255,255,0.22); background-clip: padding-box; }
*{ scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.15) transparent; }

/* ============================================================
   1. BACKGROUND FX — particles, spotlight, blobs
   ============================================================ */
#particles-canvas{ position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0.55; }
.spotlight{
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: radial-gradient(650px circle at var(--mx) var(--my), rgba(124,92,255,0.10), transparent 45%);
  transition: opacity .3s ease;
}
.bg-blobs{ position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bg-blobs span{
  position: absolute; border-radius: 50%; filter: blur(90px); opacity: 0.20;
  animation: float-blob 22s ease-in-out infinite;
}
.bg-blobs span:nth-child(1){ width: 480px; height: 480px; background: #7c5cff; top: -140px; left: -100px; animation-duration: 26s; }
.bg-blobs span:nth-child(2){ width: 420px; height: 420px; background: #22d3ee; bottom: -160px; right: -80px; animation-duration: 30s; animation-delay: -8s; }
.bg-blobs span:nth-child(3){ width: 320px; height: 320px; background: #ff7a59; top: 40%; left: 60%; animation-duration: 24s; animation-delay: -4s; opacity: 0.12; }
@keyframes float-blob{
  0%,100%{ transform: translate(0,0) scale(1); }
  33%{ transform: translate(40px,-30px) scale(1.08); }
  66%{ transform: translate(-30px,25px) scale(0.95); }
}
@media (prefers-reduced-motion: reduce){ .bg-blobs span{ animation: none; } }

/* ============================================================
   2. LAYOUT SHELL
   ============================================================ */
.app-shell{ position: relative; z-index: 1; display: flex; min-height: 100vh; }
.sidebar{
  position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w);
  display: flex; flex-direction: column;
  background: rgba(10,11,15,0.72);
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  border-right: 1px solid var(--border);
  z-index: 40; transition: width .25s var(--ease), transform .25s var(--ease);
}
.app-shell.collapsed .sidebar{ width: var(--sidebar-w-collapsed); }
.main-area{ flex: 1; margin-left: var(--sidebar-w); min-width: 0; transition: margin-left .25s var(--ease); position: relative; z-index: 1; }
.app-shell.collapsed .main-area{ margin-left: var(--sidebar-w-collapsed); }

.sidebar-brand{ display:flex; align-items:center; gap:12px; padding: 20px 20px 16px; }
.sidebar-brand .logo{ width:38px; height:38px; border-radius:11px; background: var(--accent-grad); display:flex; align-items:center; justify-content:center; font-size:18px; flex-shrink:0; box-shadow: 0 4px 18px rgba(124,92,255,0.4); }
.sidebar-brand .brand-text{ overflow:hidden; white-space:nowrap; }
.sidebar-brand .brand-text strong{ display:block; font-size:14.5px; font-weight:700; }
.sidebar-brand .brand-text span{ display:block; font-size:11px; color:var(--text-tertiary); }
.app-shell.collapsed .brand-text{ display:none; }

.sidebar-search{ margin: 4px 16px 14px; }
.sidebar-search button{
  width:100%; display:flex; align-items:center; gap:10px; padding:10px 12px;
  background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-md);
  color: var(--text-secondary); font-size: 13px; transition: all .18s var(--ease);
}
.sidebar-search button:hover{ background: var(--surface-hover); border-color: var(--border-strong); color: var(--text); }
.sidebar-search kbd{ margin-left:auto; font-size:10.5px; background:rgba(255,255,255,0.08); padding:2px 6px; border-radius:5px; color:var(--text-tertiary); }
.app-shell.collapsed .sidebar-search span, .app-shell.collapsed .sidebar-search kbd{ display:none; }

.sidebar-nav{ flex:1; overflow-y: auto; padding: 4px 12px 12px; }
.nav-group{ margin-bottom: 6px; }
.nav-group-title{
  display:flex; align-items:center; justify-content:space-between; gap:8px; padding: 10px 10px 6px; cursor:pointer;
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-tertiary); font-weight:700;
  user-select:none;
}
.nav-group-title .chev{ transition: transform .2s var(--ease); font-size: 10px; }
.nav-group.open .nav-group-title .chev{ transform: rotate(90deg); }
.nav-group-body{ max-height: 0; overflow: hidden; transition: max-height .3s var(--ease); }
.nav-group.open .nav-group-body{ max-height: 2000px; }
.app-shell.collapsed .nav-group-title span, .app-shell.collapsed .nav-group-title .chev{ display:none; }

.nav-link{
  display:flex; align-items:center; gap:12px; padding: 9px 10px; border-radius: var(--radius-sm);
  color: var(--text-secondary); font-size: 13.5px; font-weight:500; position:relative; transition: all .15s var(--ease);
  white-space:nowrap;
}
.nav-link .ic{ width:18px; height:18px; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:15px; }
.nav-link:hover{ background: var(--surface-hover); color: var(--text); }
.nav-link.active{ background: linear-gradient(90deg, rgba(124,92,255,0.18), rgba(34,211,238,0.06)); color: #fff; }
.nav-link.active::before{ content:''; position:absolute; left:-12px; top:50%; transform:translateY(-50%); width:3px; height:60%; background: var(--accent-grad); border-radius:3px; }
.nav-link .badge-mini{ margin-left:auto; font-size:10px; background: rgba(255,255,255,0.08); padding:1px 6px; border-radius:20px; color: var(--text-tertiary); }
.nav-link.locked{ opacity: 0.45; }
.nav-link .done-check{ margin-left:auto; color: var(--success); font-size:12px; }
.app-shell.collapsed .nav-link span:not(.ic){ display:none; }
.app-shell.collapsed .nav-link .badge-mini, .app-shell.collapsed .nav-link .done-check{ display:none; }

.sidebar-footer{ padding: 12px; border-top: 1px solid var(--border); display:flex; flex-direction:column; gap:8px; }
.profile-card{ display:flex; align-items:center; gap:10px; padding:8px; border-radius: var(--radius-md); transition: background .15s; cursor:pointer; }
.profile-card:hover{ background: var(--surface-hover); }
.profile-avatar{ width:36px; height:36px; border-radius:50%; background: var(--accent-grad); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex-shrink:0; }
.profile-info{ overflow:hidden; flex:1; }
.profile-info strong{ display:block; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.profile-info .xp-bar-mini{ height:4px; background: rgba(255,255,255,0.08); border-radius:4px; margin-top:4px; overflow:hidden; }
.profile-info .xp-bar-mini > div{ height:100%; background: var(--accent-grad); border-radius:4px; }
.app-shell.collapsed .profile-info{ display:none; }
.sidebar-actions{ display:flex; flex-wrap:wrap; gap:6px; }
.icon-btn{
  width:34px; height:34px; border-radius: var(--radius-sm); display:flex; align-items:center; justify-content:center;
  background: var(--surface); border:1px solid var(--border); color: var(--text-secondary); font-size:15px; transition: all .15s var(--ease);
  flex-shrink:0;
}
.icon-btn:hover{ background: var(--surface-hover); color:#fff; border-color: var(--border-strong); transform: translateY(-1px); }
.icon-btn.active{ background: rgba(124,92,255,0.18); color: #c4b5fd; border-color: rgba(124,92,255,0.4); }
.sidebar-collapse-btn{ flex:1; min-width: 60px; }

/* Recolhido: empilha os botões de ação verticalmente para nunca estourar a largura do rail */
.app-shell.collapsed .sidebar-actions{ flex-direction:column; flex-wrap:nowrap; }
.app-shell.collapsed .sidebar-actions .icon-btn{ width:100%; }
.app-shell.collapsed .sidebar-collapse-btn{ min-width:0; }
.app-shell.collapsed .sidebar-brand{ justify-content:center; padding-left:0; padding-right:0; }
.app-shell.collapsed .profile-card{ justify-content:center; }
.app-shell.collapsed .sidebar-search button{ justify-content:center; }
.sidebar-credit{ text-align:center; font-size:10px; color:var(--text-tertiary); padding-top:4px; opacity:.7; }
.app-shell.collapsed .sidebar-credit{ display:none; }

.mobile-topbar{ display:none; }
.sidebar-overlay{ display:none; }

/* ============================================================
   3. TOPBAR + VIEW ROOT
   ============================================================ */
.topbar{
  position: sticky; top:0; z-index: 30; height: var(--topbar-h);
  display:flex; align-items:center; gap:14px; padding: 0 28px;
  background: rgba(8,9,12,0.55); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}
.breadcrumb{ font-size: 13px; color: var(--text-tertiary); display:flex; align-items:center; gap:6px; }
.breadcrumb b{ color: var(--text); font-weight:600; }
.topbar-search{ flex:1; max-width: 420px; margin-left: 12px; }
.topbar-search button{ width:100%; display:flex; align-items:center; gap:10px; padding:9px 14px; background: var(--surface); border:1px solid var(--border); border-radius: 999px; color: var(--text-tertiary); font-size:13px; transition: all .15s; }
.topbar-search button:hover{ background: var(--surface-hover); border-color: var(--border-strong); }
.topbar-right{ margin-left:auto; display:flex; align-items:center; gap:10px; }
.streak-pill{ display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; background: linear-gradient(135deg, rgba(255,122,89,0.15), rgba(251,191,36,0.1)); border:1px solid rgba(251,191,36,0.25); font-size:12.5px; font-weight:600; color:#fbbf24; }

#view-root{ padding: 28px 32px 90px; max-width: 1400px; margin: 0 auto; position:relative; z-index:1; }
.view-enter{ animation: view-fade .35s var(--ease); }
@keyframes view-fade{ from{ opacity:0; transform: translateY(10px); } to{ opacity:1; transform:none; } }

.focus-mode .sidebar, .focus-mode .topbar{ display:none !important; }
.focus-mode .main-area{ margin-left:0; }
.focus-mode #view-root{ max-width: 820px; padding-top: 50px; }
#focus-exit-fab{ display:none; position:fixed; top:18px; right:18px; z-index:60; box-shadow: var(--shadow-md); }
.focus-mode #focus-exit-fab{ display:inline-flex; }

/* ============================================================
   4. TYPOGRAPHY / PAGE HEADERS
   ============================================================ */
.page-head{ margin-bottom: 28px; }
.eyebrow{ font-size:11.5px; text-transform:uppercase; letter-spacing:0.1em; color: var(--accent-2); font-weight:700; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.page-title{ font-size: clamp(24px, 3vw, 34px); margin-bottom: 8px; background: linear-gradient(135deg,#fff,#c7c9d1); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.page-sub{ color: var(--text-secondary); font-size: 15px; max-width: 720px; }

/* ============================================================
   5. CARDS / GLASS / GRID
   ============================================================ */
.glass{ background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.card{ background: linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.015)); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .2s; }
.card:hover{ border-color: var(--border-strong); box-shadow: var(--shadow-md); }
.tilt-card{ will-change: transform; transition: transform .12s ease-out; }
.card-hover-lift:hover{ transform: translateY(-4px); }
.grid{ display:grid; gap: 18px; }
.grid-2{ grid-template-columns: repeat(2, 1fr); }
.grid-3{ grid-template-columns: repeat(3, 1fr); }
.grid-4{ grid-template-columns: repeat(4, 1fr); }
.grid-auto{ grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.grid-auto-sm{ grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
@media (max-width: 1100px){ .grid-4{ grid-template-columns: repeat(2,1fr);} .grid-3{ grid-template-columns: repeat(2,1fr);} }
@media (max-width: 640px){ .grid-2, .grid-3, .grid-4{ grid-template-columns: 1fr; } }

/* ============================================================
   6. BUTTONS / BADGES / INPUTS
   ============================================================ */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding: 10px 18px; border-radius: var(--radius-md); font-size: 13.5px; font-weight:600; transition: all .18s var(--ease); border:1px solid transparent; white-space:nowrap; }
.btn-primary{ background: var(--accent-grad); color:#fff; box-shadow: 0 6px 20px rgba(124,92,255,0.35); }
.btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 10px 26px rgba(124,92,255,0.45); filter: brightness(1.08); }
.btn-ghost{ background: var(--surface); border-color: var(--border); color: var(--text); }
.btn-ghost:hover{ background: var(--surface-hover); border-color: var(--border-strong); transform: translateY(-1px); }
.btn-outline{ background: transparent; border-color: var(--border-strong); color: var(--text-secondary); }
.btn-outline:hover{ color:#fff; border-color: #fff; }
.btn-sm{ padding: 6px 12px; font-size:12px; border-radius: var(--radius-sm); }
.btn-block{ width:100%; }
.btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none !important; }
.btn-icon-only{ padding:8px; }

.badge{ display:inline-flex; align-items:center; gap:5px; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight:700; letter-spacing:0.02em; border:1px solid transparent; }
.badge-Iniciante{ background: rgba(52,211,153,0.14); color:#34d399; border-color: rgba(52,211,153,0.3); }
.badge-Intermediário{ background: rgba(96,165,250,0.14); color:#60a5fa; border-color: rgba(96,165,250,0.3); }
.badge-Avançado{ background: rgba(251,191,36,0.14); color:#fbbf24; border-color: rgba(251,191,36,0.3); }
.badge-Especialista{ background: rgba(248,113,113,0.14); color:#f87171; border-color: rgba(248,113,113,0.3); }
.badge-neutral{ background: rgba(255,255,255,0.08); color: var(--text-secondary); }
.badge-accent{ background: rgba(124,92,255,0.16); color:#c4b5fd; border-color: rgba(124,92,255,0.32); }

.input, .textarea, select.input{ width:100%; padding: 10px 14px; background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-md); font-size: 13.5px; transition: border-color .15s; }
.input:focus, .textarea:focus{ border-color: var(--accent-1); background: rgba(124,92,255,0.06); }
.textarea{ resize: vertical; min-height: 120px; font-family: var(--font-mono); line-height:1.6; }

.status-trigger{ width:100%; display:flex; align-items:center; gap:10px; padding:10px 14px; background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-md); font-size:13.5px; color:var(--text); transition: border-color .15s; }
.status-trigger:hover{ border-color: var(--border-strong); }
.status-trigger .chev{ margin-left:auto; font-size:11px; color: var(--text-tertiary); }
.status-trigger.menu-open{ border-color: var(--accent-1); }
.status-dot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; background: var(--text-tertiary); }
.status-dot.status-nao-iniciado{ background: var(--text-tertiary); }
.status-dot.status-em-andamento{ background: var(--info); }
.status-dot.status-concluido{ background: var(--success); }
/* Portal: renderizado fora dos cards (que têm will-change:transform e criam contexto de
   empilhamento próprio), garantindo que o menu sempre fique por cima de tudo, sem cortes. */
.status-menu-portal{ position:fixed; z-index:200; background: var(--bg-elevated-2); border:1px solid var(--border-strong); border-radius: var(--radius-md); box-shadow: var(--shadow-lg); overflow:hidden; display:none; }
.status-menu-portal.open{ display:block; }
.status-option{ width:100%; display:flex; align-items:center; gap:10px; padding:10px 14px; font-size:13px; color: var(--text-secondary); text-align:left; }
.status-option:hover{ background: var(--surface-hover); color: var(--text); }
.status-option.active{ color: var(--text); font-weight:600; }

.progress{ height: 8px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow:hidden; }
.progress > div{ height:100%; border-radius:999px; background: var(--accent-grad); transition: width .5s var(--ease); }
.progress.thin{ height:5px; }

.ring{ position:relative; width:110px; height:110px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.ring::before{ content:''; position:absolute; inset:0; border-radius:50%; background: conic-gradient(var(--accent-1) calc(var(--pct,0)*1%), rgba(255,255,255,0.07) 0); }
.ring::after{ content:''; position:absolute; inset:9px; border-radius:50%; background: var(--bg-elevated); }
.ring .ring-label{ position:relative; z-index:1; text-align:center; }
.ring .ring-label strong{ font-size:20px; display:block; }
.ring .ring-label span{ font-size:10px; color: var(--text-tertiary); }

/* ============================================================
   7. STAT TILES / DASHBOARD BITS
   ============================================================ */
.stat-tile{ padding: 18px; border-radius: var(--radius-lg); background: linear-gradient(160deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015)); border:1px solid var(--border); }
.stat-tile .stat-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.stat-tile .stat-icon{ width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; background: rgba(124,92,255,0.14); }
.stat-tile .stat-value{ font-size: 26px; font-weight:800; letter-spacing:-0.02em; }
.stat-tile .stat-label{ font-size:12px; color: var(--text-tertiary); margin-top:2px; }
.stat-tile .stat-delta{ font-size:11px; color: var(--success); margin-top:6px; }

.heatmap{ display:grid; grid-template-columns: repeat(26, 1fr); gap:3px; }
.heatmap .cell{ aspect-ratio:1; border-radius:3px; background: rgba(255,255,255,0.06); }
.heatmap .cell[data-lvl="1"]{ background: rgba(124,92,255,0.28); }
.heatmap .cell[data-lvl="2"]{ background: rgba(124,92,255,0.5); }
.heatmap .cell[data-lvl="3"]{ background: rgba(124,92,255,0.75); }
.heatmap .cell[data-lvl="4"]{ background: #7c5cff; box-shadow: 0 0 8px rgba(124,92,255,0.6); }

.bar-chart{ display:flex; align-items:flex-end; gap:10px; height:120px; }
.bar-chart .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
.bar-chart .bar{ width:100%; border-radius: 6px 6px 0 0; background: var(--accent-grad); min-height:4px; transition: height .5s var(--ease); }
.bar-chart .bar-lbl{ font-size:10px; color: var(--text-tertiary); }

/* ============================================================
   8. ROADMAP
   ============================================================ */
.roadmap-track{ display:flex; flex-direction:column; align-items:center; gap:0; padding: 20px 0; }
.roadmap-node-wrap{ display:flex; flex-direction:column; align-items:center; width:100%; max-width:640px; }
.roadmap-connector{ width:3px; height:44px; background: linear-gradient(180deg, rgba(124,92,255,0.5), rgba(34,211,238,0.15)); }
.roadmap-node{ width:100%; display:flex; align-items:center; gap:16px; padding: 18px 22px; border-radius: var(--radius-xl); position:relative; }
.roadmap-node .rn-num{ width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; flex-shrink:0; background: var(--accent-grad); color:#fff; }
.roadmap-node.locked .rn-num{ background: rgba(255,255,255,0.08); color: var(--text-tertiary); }
.roadmap-node.done .rn-num{ background: var(--success); }
.roadmap-node .rn-body{ flex:1; }
.roadmap-node .rn-body h4{ font-size:15.5px; margin-bottom:3px; }
.roadmap-node .rn-body p{ font-size:12.5px; color: var(--text-tertiary); }
.roadmap-node.locked{ opacity:0.5; }
.roadmap-node .rn-lock{ font-size: 18px; color: var(--text-tertiary); }

/* ============================================================
   9. LESSON VIEWER
   ============================================================ */
.lesson-layout{ display:grid; grid-template-columns: 1fr 260px; gap:28px; align-items:start; }
@media (max-width: 980px){ .lesson-layout{ grid-template-columns: 1fr; } }
.lesson-toc{ position:sticky; top: calc(var(--topbar-h) + 20px); }
.lesson-toc a{ display:block; padding:7px 12px; font-size:12.5px; color: var(--text-tertiary); border-left:2px solid var(--border); transition: all .15s; }
.lesson-toc a:hover, .lesson-toc a.active{ color:#fff; border-color: var(--accent-1); }
.lesson-section{ margin-bottom: 30px; }
.lesson-section h3{ font-size:18px; margin-bottom:12px; display:flex; align-items:center; gap:10px; }
.lesson-section p{ color: var(--text-secondary); margin-bottom:12px; font-size:14.5px; }
.lesson-section ul.styled-list li{ position:relative; padding-left:22px; margin-bottom:8px; font-size:14px; color: var(--text-secondary); }
.lesson-section ul.styled-list li::before{ content:'→'; position:absolute; left:0; color: var(--accent-2); font-weight:700; }
.code-block{ position:relative; background: #0a0b0f; border:1px solid var(--border); border-radius: var(--radius-md); overflow:hidden; margin-bottom:14px; }
.code-block .code-head{ display:flex; align-items:center; justify-content:space-between; padding:8px 14px; background: rgba(255,255,255,0.03); border-bottom:1px solid var(--border); font-size:11px; color: var(--text-tertiary); text-transform:uppercase; letter-spacing:0.05em; }
.code-block pre{ padding: 16px; overflow-x:auto; font-family: var(--font-mono); font-size: 12.8px; line-height:1.65; color:#d4d7e0; }
.flow-diagram{ display:flex; flex-wrap:wrap; align-items:center; gap:0; margin: 16px 0; }
.flow-step{ padding: 12px 16px; border-radius: var(--radius-md); background: var(--surface); border:1px solid var(--border-strong); font-size:12.5px; font-weight:600; text-align:center; min-width:120px; }
.flow-arrow{ padding: 0 10px; color: var(--accent-2); font-size:18px; }
.mistake-box, .practice-box{ padding:12px 14px; border-radius: var(--radius-md); margin-bottom:8px; font-size:13.5px; display:flex; gap:10px; align-items:flex-start; }
.mistake-box{ background: rgba(248,113,113,0.08); border:1px solid rgba(248,113,113,0.2); }
.practice-box{ background: rgba(52,211,153,0.08); border:1px solid rgba(52,211,153,0.2); }
.checklist-item{ display:flex; align-items:center; gap:10px; padding:9px 4px; font-size:14px; border-bottom:1px solid var(--border); cursor:pointer; }
.checklist-item .chk{ width:18px; height:18px; border-radius:5px; border:1.5px solid var(--border-strong); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:11px; transition: all .15s; }
.checklist-item.checked .chk{ background: var(--success); border-color: var(--success); }
.checklist-item.checked span.txt{ color: var(--text-tertiary); text-decoration: line-through; }
.lesson-nav-btns{ display:flex; justify-content:space-between; gap:12px; margin-top: 36px; padding-top:24px; border-top:1px solid var(--border); }

/* ============================================================
   10. QUIZ
   ============================================================ */
.quiz-q{ margin-bottom:22px; padding:18px; border-radius: var(--radius-lg); background: var(--surface); border:1px solid var(--border); }
.quiz-q .q-text{ font-size:14.5px; font-weight:600; margin-bottom:14px; }
.quiz-opt{ display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius: var(--radius-md); border:1px solid var(--border); margin-bottom:8px; font-size:13.5px; transition: all .15s; }
.quiz-opt:hover{ background: var(--surface-hover); }
.quiz-opt.selected{ border-color: var(--accent-1); background: rgba(124,92,255,0.1); }
.quiz-opt.correct{ border-color: var(--success); background: rgba(52,211,153,0.12); }
.quiz-opt.wrong{ border-color: var(--danger); background: rgba(248,113,113,0.12); }
.quiz-explain{ margin-top:10px; padding:10px 14px; border-radius: var(--radius-sm); background: rgba(96,165,250,0.08); font-size:13px; color: var(--text-secondary); display:none; }
.quiz-explain.show{ display:block; }

/* ============================================================
   11. MODALS / TOASTS / COMMAND PALETTE
   ============================================================ */
.modal-backdrop{ position:fixed; inset:0; background: rgba(4,5,8,0.65); backdrop-filter: blur(4px); z-index:100; display:flex; align-items:flex-start; justify-content:center; padding: 10vh 20px 20px; opacity:0; pointer-events:none; transition: opacity .2s; }
.modal-backdrop.open{ opacity:1; pointer-events:auto; }
.cmdk{ width:100%; max-width:620px; max-height:70vh; display:flex; flex-direction:column; background: rgba(16,17,23,0.92); border:1px solid var(--border-strong); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); overflow:hidden; transform: translateY(-16px); transition: transform .25s var(--ease); }
.modal-backdrop.open .cmdk{ transform:none; }
.cmdk-input{ display:flex; align-items:center; gap:10px; padding: 16px 18px; border-bottom:1px solid var(--border); }
.cmdk-input input{ flex:1; background:none; border:none; font-size:15px; color:#fff; }
.cmdk-results{ overflow-y:auto; padding: 8px; }
.cmdk-group-title{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; color: var(--text-tertiary); padding: 10px 10px 4px; font-weight:700; }
.cmdk-item{ display:flex; align-items:center; gap:12px; padding: 10px 12px; border-radius: var(--radius-sm); font-size:13.5px; }
.cmdk-item:hover{ background: var(--surface-hover); }
.cmdk-item .cmdk-cat{ margin-left:auto; font-size:10.5px; color: var(--text-tertiary); }

.simple-modal{ width:100%; max-width:520px; background: rgba(16,17,23,0.95); border:1px solid var(--border-strong); border-radius: var(--radius-lg); padding:26px; box-shadow: var(--shadow-lg); transform: translateY(-16px); transition: transform .25s var(--ease); }
.modal-backdrop.open .simple-modal{ transform:none; }

#toast-container{ position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
.toast{ display:flex; align-items:center; gap:12px; padding: 14px 18px; border-radius: var(--radius-md); background: rgba(18,20,27,0.95); border:1px solid var(--border-strong); box-shadow: var(--shadow-lg); font-size:13.5px; min-width:260px; animation: toast-in .3s var(--ease); }
@keyframes toast-in{ from{ opacity:0; transform: translateX(40px);} to{ opacity:1; transform:none; } }
.toast.leaving{ animation: toast-out .25s var(--ease) forwards; }
@keyframes toast-out{ to{ opacity:0; transform: translateX(40px); } }
.toast .t-icon{ width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; background: var(--accent-grad); flex-shrink:0; }

/* ============================================================
   12. MISC UTILITIES
   ============================================================ */
.flex{ display:flex; } .items-center{ align-items:center; } .justify-between{ justify-content:space-between; } .gap-8{gap:8px;} .gap-12{gap:12px;} .gap-16{gap:16px;} .flex-wrap{flex-wrap:wrap;}
.mt-8{margin-top:8px;} .mt-16{margin-top:16px;} .mt-24{margin-top:24px;} .mb-16{margin-bottom:16px;}
.text-secondary{ color: var(--text-secondary); } .text-tertiary{ color: var(--text-tertiary); } .text-sm{ font-size:12.5px; }
.empty-state{ text-align:center; padding: 60px 20px; color: var(--text-tertiary); }
.empty-state .es-icon{ font-size:40px; margin-bottom:14px; }
.tabs{ display:flex; gap:6px; border-bottom:1px solid var(--border); margin-bottom:22px; overflow-x:auto; }
.tab-btn{ padding: 10px 16px; font-size:13.5px; font-weight:600; color: var(--text-tertiary); border-bottom:2px solid transparent; white-space:nowrap; }
.tab-btn.active{ color:#fff; border-color: var(--accent-1); }

.filter-chip:hover{ border-color: var(--border-strong); }
.filter-chip.active{ background: var(--accent-grad); color:#fff; border-color:transparent; }
.fav-star{ font-size:16px; color: var(--text-tertiary); transition: all .15s; }
.fav-star.active{ color: #fbbf24; }
.fav-star:hover{ color: #fbbf24; transform: scale(1.15); }
hr.sep{ border:none; border-top:1px solid var(--border); margin: 24px 0; }
.flash-back{ display:none; opacity:0; transition: opacity .25s ease; }

.md-pre{ background:#0a0b0f; border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px; overflow-x:auto; font-family:var(--font-mono); font-size:12.5px; margin:10px 0; }

#note-preview h2, #note-preview h3, #note-preview h4{ margin:14px 0 8px; }

}

/* ============================================================
   UTILITIES
   ============================================================ */
const $ = (sel, el) => (el||document).querySelector(sel);
const $$ = (sel, el) => Array.from((el||document).querySelectorAll(sel));
const uid = (p) => (p||'id') + '-' + Math.random().toString(36).slice(2,9);
function escapeHtml(str){ return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function debounce(fn, wait){ let t; return function(...a){ clearTimeout(t); t = setTimeout(()=>fn.apply(this,a), wait); }; }
function fmtMinutes(min){ if(min < 60) return min + ' min'; const h = Math.floor(min/60), m = min%60; return h + 'h' + (m? ' '+m+'min':''); }
function fmtDate(d){ const dt = new Date(d); return dt.toLocaleDateString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric'}); }
function todayISO(){ const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
function clamp(n,min,max){ return Math.max(min, Math.min(max,n)); }
function simpleMarkdown(text){
  let html = escapeHtml(text||'');
  html = html.replace(/```([\s\S]*?)```/g, (m,c) => '<pre class="md-pre">'+c.trim()+'</pre>');
  html = html.replace(/`([^`]+)`/g, '<code class="md-code">$1</code>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/^### (.*)$/gm, '<h4>$1</h4>');
  html = html.replace(/^## (.*)$/gm, '<h3>$1</h3>');
  html = html.replace(/^# (.*)$/gm, '<h2>$1</h2>');
  html = html.replace(/^- (.*)$/gm, '<li>$1</li>').replace(/(<li>.*<\/li>\n?)+/g, m => '<ul class="styled-list">'+m+'</ul>');
  html = html.split(/\n{2,}/).map(p => /^<(h2|h3|h4|ul|pre)/.test(p.trim()) ? p : '<p>'+p.replace(/\n/g,'<br>')+'</p>').join('');
  return html;
}
function toast(message, opts){
  opts = opts || {};
  const c = $('#toast-container');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<div class="t-icon">'+(opts.icon||'✓')+'</div><div><strong style="display:block;font-size:13px;">'+escapeHtml(opts.title||message)+'</strong>'+(opts.title? '<span style="color:var(--text-tertiary);font-size:12px;">'+escapeHtml(message)+'</span>':'')+'</div>';
  c.appendChild(el);
  setTimeout(()=>{ el.classList.add('leaving'); setTimeout(()=>el.remove(), 260); }, opts.duration || 3200);
}

`from fastapi import FastAPI, HTTPException
from pydantic import BaseModel

app = FastAPI(title="API de Resumo de Texto")

class PedidoResumo(BaseModel):
    texto: str
    tamanho_maximo: int = 100  # valor padrão

class RespostaResumo(BaseModel):
    resumo: str
    tokens_aproximados: int

@app.get("/")
def raiz():
    return {"status": "API no ar", "versao": "1.0"}

@app.post("/resumir", response_model=RespostaResumo)
def resumir_texto(pedido: PedidoResumo):
    if len(pedido.texto.strip()) == 0:
        raise HTTPException(status_code=400, detail="O texto não pode estar vazio.")

    # Aqui entraria a chamada real a um LLM
    resumo_simulado = pedido.texto[:pedido.tamanho_maximo] + "..."

    return RespostaResumo(
        resumo=resumo_simulado,
        tokens_aproximados=len(resumo_simulado) // 4
    )

# Executar com: uvicorn nome_do_arquivo:app --reload
# Documentação automática disponível em: http://localhost:8000/docs

`def gerenciar_historico(historico, limite_mensagens=10):
    """Mantém apenas as últimas N mensagens do histórico de conversa."""
    if len(historico) <= limite_mensagens:
        return historico
    # Sempre mantém a mensagem de sistema (índice 0), se existir
    sistema = [historico[0]] if historico and historico[0]["role"] == "system" else []
    recentes = historico[-limite_mensagens:]
    return sistema + recentes
` },

`def chunking_por_tamanho(texto, tamanho_chunk=500, overlap=50):
    """Divide o texto em chunks de tamanho fixo, com sobreposição."""
    chunks = []
    inicio = 0
    while inicio < len(texto):
        fim = inicio + tamanho_chunk
        chunks.append(texto[inicio:fim])
        inicio += tamanho_chunk - overlap  # avança considerando a sobreposição
    return chunks

def chunking_por_paragrafo(texto, tamanho_maximo=800):
    """Divide respeitando parágrafos, agrupando até o tamanho máximo."""
    paragrafos = texto.split("\\n\\n")
    chunks, atual = [], ""
    for p in paragrafos:
        if len(atual) + len(p) <= tamanho_maximo:
            atual += p + "\\n\\n"
        else:
            chunks.append(atual.strip())
            atual = p + "\\n\\n"
    if atual:
        chunks.append(atual.strip())
    return chunks

  { term:'Prompt Tuning', cat:'Prompt Engineering', def:'Técnica de otimização automática de prompts (por vezes usando vetores treináveis) para melhorar o desempenho em uma tarefa específica.' },
  { term:'Meta-Prompt', cat:'Prompt Engineering', def:'Prompt usado para gerar ou otimizar outros prompts.' },
  { term:'Grounding', cat:'Prompt Engineering', def:'Técnica de ancorar a resposta do modelo em uma fonte de informação confiável e verificável, reduzindo alucinações.' },

  { term:'RAG (Retrieval-Augmented Generation)', cat:'RAG', def:'Arquitetura que combina busca de informação relevante em uma base de dados com a geração de texto por um LLM, ancorando a resposta em fontes reais.' },
  { term:'Retriever', cat:'RAG', def:'Componente responsável por buscar os trechos de informação mais relevantes para uma consulta em um sistema RAG.' },
  { term:'Generator', cat:'RAG', def:'Componente (geralmente um LLM) responsável por gerar a resposta final combinando a pergunta com os trechos recuperados.' },
  { term:'Chunking', cat:'RAG', def:'Processo de dividir documentos longos em pedaços menores (chunks) para facilitar a indexação e recuperação.' },
  { term:'Chunk Overlap', cat:'RAG', def:'Sobreposição de conteúdo entre chunks consecutivos, usada para preservar contexto que atravessa a fronteira entre eles.' },
  { term:'Indexação', cat:'RAG', def:'Processo de organizar dados (geralmente em vetores) de forma que possam ser buscados de forma rápida e eficiente.' },
  { term:'Embedding Model', cat:'RAG', def:'Modelo especializado em transformar texto em vetores numéricos que capturam seu significado semântico.' },
  { term:'Similaridade de Cosseno', cat:'RAG', def:'Métrica que mede o quão parecidos dois vetores são, calculando o cosseno do ângulo entre eles.' },
  { term:'Top-K Retrieval', cat:'RAG', def:'Estratégia de recuperar os K documentos ou trechos mais relevantes para uma consulta.' },
  { term:'Re-ranking', cat:'RAG', def:'Etapa adicional que reordena os resultados inicialmente recuperados usando um critério mais preciso (e geralmente mais custoso) de relevância.' },
  { term:'Hybrid Search', cat:'RAG', def:'Estratégia que combina busca semântica (vetorial) com busca lexical (palavra-chave) para melhorar a precisão dos resultados.' },
  { term:'BM25', cat:'RAG', def:'Algoritmo clássico de busca lexical baseado em frequência de termos, muito usado como componente de busca por palavra-chave.' },
  { term:'Busca Semântica', cat:'RAG', def:'Busca baseada no significado do texto, usando embeddings, em vez de correspondência exata de palavras.' },
  { term:'Busca Lexical', cat:'RAG', def:'Busca tradicional baseada na correspondência exata (ou aproximada) de palavras-chave.' },
  { term:'Grounding de Resposta', cat:'RAG', def:'Prática de basear a resposta gerada exclusivamente nas informações recuperadas, citando as fontes usadas.' },
  { term:'Citação de Fonte', cat:'RAG', def:'Indicação explícita de qual documento ou trecho embasou determinada parte da resposta gerada.' },
  { term:'Knowledge Base', cat:'RAG', def:'Base de conhecimento estruturada (documentos, FAQs, artigos) usada como fonte de informação para um sistema RAG.' },
  { term:'Ingestão de Dados', cat:'RAG', def:'Etapa inicial de um pipeline RAG em que os documentos são coletados, limpos e preparados para indexação.' },
  { term:'Pipeline de RAG', cat:'RAG', def:'Sequência completa de etapas de um sistema RAG: ingestão, chunking, embedding, armazenamento, recuperação e geração.' },
  { term:'Context Stuffing', cat:'RAG', def:'Prática (geralmente inadequada) de inserir grandes quantidades de texto bruto no prompt em vez de recuperar apenas os trechos relevantes.' },

  { term:'Banco de Dados Vetorial', cat:'Vector DB', def:'Banco de dados especializado em armazenar e buscar vetores de alta dimensão por similaridade, essencial para sistemas de busca semântica e RAG.' },
  { term:'ChromaDB', cat:'Vector DB', def:'Banco de dados vetorial open-source, leve e fácil de usar, popular para prototipagem de aplicações RAG.' },
  { term:'FAISS', cat:'Vector DB', def:'Biblioteca open-source da Meta para busca eficiente de similaridade em grandes coleções de vetores.' },
  { term:'Pinecone', cat:'Vector DB', def:'Banco de dados vetorial gerenciado na nuvem, focado em escalabilidade e baixa latência para produção.' },
  { term:'Qdrant', cat:'Vector DB', def:'Banco de dados vetorial open-source escrito em Rust, com suporte a filtros de metadados avançados.' },
  { term:'Weaviate', cat:'Vector DB', def:'Banco de dados vetorial open-source com suporte nativo a busca híbrida (vetorial + lexical) e módulos de IA integrados.' },
  { term:'Índice Vetorial', cat:'Vector DB', def:'Estrutura de dados otimizada que permite buscar vetores semelhantes rapidamente, sem comparar com todos os vetores armazenados.' },
  { term:'ANN (Approximate Nearest Neighbor)', cat:'Vector DB', def:'Família de algoritmos que busca vizinhos aproximadamente mais próximos, trocando precisão perfeita por velocidade em grandes escalas.' },
  { term:'HNSW', cat:'Vector DB', def:'Algoritmo de indexação baseado em grafos, muito usado em bancos vetoriais por seu equilíbrio entre velocidade e precisão.' },
  { term:'Dimensionalidade do Vetor', cat:'Vector DB', def:'Número de componentes numéricos que compõem um vetor de embedding, definido pelo modelo que o gerou.' },
  { term:'Metadata Filtering', cat:'Vector DB', def:'Capacidade de filtrar resultados de busca vetorial com base em atributos adicionais, como data ou categoria.' },
  { term:'Namespace', cat:'Vector DB', def:'Divisão lógica dentro de um banco vetorial usada para isolar diferentes conjuntos de dados ou clientes.' },
  { term:'Collection', cat:'Vector DB', def:'Agrupamento de vetores relacionados dentro de um banco de dados vetorial, similar a uma tabela em bancos relacionais.' },
  { term:'Upsert', cat:'Vector DB', def:'Operação que insere um novo registro ou atualiza um existente caso ele já esteja presente no banco.' },
  { term:'Vector Store', cat:'Vector DB', def:'Termo genérico para qualquer sistema de armazenamento especializado em vetores, usado em frameworks como LangChain.' },

  { term:'Agente de IA', cat:'Agentes', def:'Sistema baseado em LLM capaz de perceber um contexto, raciocinar sobre ele e tomar ações (usando ferramentas) para atingir um objetivo.' },
  { term:'Agente Autônomo', cat:'Agentes', def:'Agente capaz de operar e tomar decisões sequenciais com mínima intervenção humana durante a execução.' },
  { term:'Function Calling', cat:'Agentes', def:'Capacidade de um LLM identificar quando deve chamar uma função externa e gerar os argumentos corretos para essa chamada.' },
  { term:'Tool Use', cat:'Agentes', def:'Capacidade de um modelo usar ferramentas externas (busca, calculadora, APIs) para complementar suas respostas.' },
  { term:'Ferramenta (Tool)', cat:'Agentes', def:'Função externa disponibilizada a um agente, com uma descrição que permite ao modelo decidir quando e como usá-la.' },
  { term:'Planejamento (Planning)', cat:'Agentes', def:'Capacidade de um agente dividir um objetivo complexo em uma sequência de etapas menores e executáveis.' },
  { term:'Memória de Curto Prazo', cat:'Agentes', def:'Contexto imediato de uma conversa ou tarefa, geralmente limitado pela janela de contexto do modelo.' },
  { term:'Memória de Longo Prazo', cat:'Agentes', def:'Armazenamento persistente (geralmente em um banco vetorial) que permite a um agente lembrar de interações passadas além da janela de contexto atual.' },
  { term:'Loop de Raciocínio', cat:'Agentes', def:'Ciclo repetido de pensar, agir e observar que um agente executa até atingir seu objetivo ou um limite de tentativas.' },
  { term:'Plan-and-Execute', cat:'Agentes', def:'Padrão de agente que primeiro cria um plano completo de etapas e depois executa cada uma, podendo replanejar se necessário.' },
  { term:'Multi-Agente', cat:'Agentes', def:'Arquitetura em que vários agentes especializados colaboram, cada um responsável por uma parte de uma tarefa maior.' },
  { term:'Orquestrador', cat:'Agentes', def:'Componente responsável por coordenar a comunicação e o fluxo de trabalho entre múltiplos agentes.' },
  { term:'Agente Especialista', cat:'Agentes', def:'Agente focado em um domínio específico (ex: pesquisa, redação, análise de dados) dentro de um sistema multi-agente.' },
  { term:'CrewAI', cat:'Agentes', def:'Framework open-source para orquestrar equipes de agentes de IA com papéis e objetivos definidos.' },
  { term:'AutoGen', cat:'Agentes', def:'Framework da Microsoft para construir sistemas multi-agente conversacionais.' },
  { term:'LangGraph', cat:'Agentes', def:'Biblioteca do ecossistema LangChain para construir agentes como grafos de estados, permitindo fluxos complexos e cíclicos.' },
  { term:'Human-in-the-loop', cat:'Agentes', def:'Padrão de design em que um humano revisa ou aprova decisões críticas de um agente antes de sua execução.' },
  { term:'Guardrails', cat:'Agentes', def:'Conjunto de regras e validações que restringem o comportamento de um agente, evitando ações indesejadas ou perigosas.' },
  { term:'Sandbox de Execução', cat:'Agentes', def:'Ambiente isolado e controlado onde um agente pode executar código ou ações com segurança, sem afetar sistemas reais.' },
  { term:'Observação (Observation)', cat:'Agentes', def:'Resultado retornado ao agente após executar uma ação, usado para decidir o próximo passo do raciocínio.' },

  { term:'MCP (Model Context Protocol)', cat:'MCP', def:'Protocolo aberto que padroniza a forma como aplicações de IA se conectam a ferramentas, dados e sistemas externos.' },
  { term:'MCP Server', cat:'MCP', def:'Programa que expõe ferramentas, recursos ou prompts para um cliente de IA seguir o protocolo MCP.' },
  { term:'MCP Client', cat:'MCP', def:'Aplicação (geralmente dentro de um host de IA) que se conecta a um MCP Server para consumir suas capacidades.' },
  { term:'MCP Host', cat:'MCP', def:'Aplicação principal (como um assistente de IA) que gerencia um ou mais clientes MCP conectados a diferentes servidores.' },
  { term:'Resource (MCP)', cat:'MCP', def:'Dado ou conteúdo exposto por um servidor MCP que pode ser lido pelo cliente, como um arquivo ou registro de banco de dados.' },
  { term:'Tool (MCP)', cat:'MCP', def:'Função exposta por um servidor MCP que o modelo pode invocar para executar uma ação específica.' },
  { term:'Prompt Template (MCP)', cat:'MCP', def:'Modelo de prompt reutilizável que um servidor MCP pode disponibilizar para os clientes conectados.' },
  { term:'Transporte (Transport)', cat:'MCP', def:'Mecanismo de comunicação usado entre cliente e servidor MCP, como stdio ou HTTP com Server-Sent Events.' },
  { term:'stdio', cat:'MCP', def:'Forma de transporte MCP que usa entrada e saída padrão do sistema operacional para comunicação local entre cliente e servidor.' },
  { term:'SSE (Server-Sent Events)', cat:'MCP', def:'Protocolo de transporte que permite um servidor enviar atualizações em tempo real para o cliente através de uma conexão HTTP.' },

  { term:'LangChain', cat:'Frameworks', def:'Framework open-source amplamente usado para construir aplicações com LLMs, oferecendo abstrações para chains, agentes e RAG.' },
  { term:'LlamaIndex', cat:'Frameworks', def:'Framework focado em indexação e recuperação de dados próprios para uso com LLMs, muito usado em sistemas RAG.' },
  { term:'Semantic Kernel', cat:'Frameworks', def:'SDK open-source da Microsoft para orquestrar IA em aplicações .NET, Python e Java.' },
  { term:'DSPy', cat:'Frameworks', def:'Framework que trata prompts como parâmetros otimizáveis programaticamente, em vez de texto fixo escrito manualmente.' },
  { term:'Haystack', cat:'Frameworks', def:'Framework open-source para construir pipelines de busca e RAG prontos para produção.' },
  { term:'OpenAI SDK', cat:'Frameworks', def:'Biblioteca oficial da OpenAI para integrar seus modelos e ferramentas em aplicações Python ou outras linguagens.' },
  { term:'Hugging Face Transformers', cat:'Frameworks', def:'Biblioteca open-source com milhares de modelos pré-treinados prontos para uso em tarefas de NLP, visão e áudio.' },
  { term:'Chain (LangChain)', cat:'Frameworks', def:'Sequência de chamadas (a modelos, ferramentas ou outras chains) combinadas para realizar uma tarefa composta.' },
  { term:'Agent Executor', cat:'Frameworks', def:'Componente que gerencia o loop de execução de um agente, decidindo quais ações tomar até finalizar a tarefa.' },
  { term:'Retriever (LangChain)', cat:'Frameworks', def:'Componente padronizado do LangChain responsável por buscar documentos relevantes de uma fonte de dados.' },
  { term:'Vector Store Integration', cat:'Frameworks', def:'Conector padronizado que permite a um framework se comunicar com diferentes bancos de dados vetoriais.' },
  { term:'Prompt Template (LangChain)', cat:'Frameworks', def:'Estrutura reutilizável de prompt com variáveis, usada para padronizar entradas enviadas ao modelo.' },
  { term:'Output Parser', cat:'Frameworks', def:'Componente que converte a resposta textual de um LLM em uma estrutura de dados utilizável pelo código, como um objeto JSON.' },
  { term:'Memory (LangChain)', cat:'Frameworks', def:'Componente responsável por armazenar e recuperar o histórico de uma conversa entre chamadas ao modelo.' },
  { term:'Callback', cat:'Frameworks', def:'Função executada automaticamente em pontos específicos de um pipeline, usada para logging, depuração ou monitoramento.' },

  { term:'Python', cat:'Python', def:'Linguagem de programação de alto nível, popular por sua sintaxe simples e pelo vasto ecossistema de bibliotecas de dados e IA.' },
  { term:'Variável', cat:'Python', def:'Espaço nomeado na memória usado para armazenar um valor que pode ser referenciado e alterado ao longo do programa.' },
  { term:'Função', cat:'Python', def:'Bloco de código reutilizável que executa uma tarefa específica e pode receber parâmetros e retornar um valor.' },
  { term:'Classe', cat:'Python', def:'Modelo (blueprint) que define atributos e comportamentos comuns a um conjunto de objetos, base da programação orientada a objetos.' },
  { term:'Objeto', cat:'Python', def:'Instância concreta de uma classe, com seus próprios valores para os atributos definidos por ela.' },
  { term:'Herança', cat:'Python', def:'Mecanismo que permite a uma classe herdar atributos e métodos de outra classe, promovendo reuso de código.' },
  { term:'Polimorfismo', cat:'Python', def:'Capacidade de objetos de classes diferentes responderem de forma distinta a uma mesma chamada de método.' },
  { term:'Encapsulamento', cat:'Python', def:'Princípio que agrupa dados e comportamentos relacionados dentro de uma classe, controlando o acesso externo a eles.' },
  { term:'Lista', cat:'Python', def:'Estrutura de dados ordenada e mutável do Python, capaz de armazenar múltiplos valores de tipos variados.' },
  { term:'Dicionário', cat:'Python', def:'Estrutura de dados do Python que armazena pares de chave e valor, permitindo acesso rápido por chave.' },
  { term:'Tupla', cat:'Python', def:'Estrutura de dados ordenada e imutável do Python, semelhante a uma lista, mas que não pode ser alterada após criada.' },
  { term:'Conjunto (Set)', cat:'Python', def:'Estrutura de dados do Python que armazena valores únicos, sem ordem definida e sem duplicatas.' },
  { term:'List Comprehension', cat:'Python', def:'Sintaxe concisa do Python para criar listas a partir de uma expressão aplicada a cada item de um iterável.' },
  { term:'Decorator', cat:'Python', def:'Função que modifica o comportamento de outra função sem alterar seu código-fonte diretamente.' },
  { term:'Lambda', cat:'Python', def:'Função anônima de uma única expressão, usada para operações curtas e pontuais.' },
  { term:'Módulo', cat:'Python', def:'Arquivo Python contendo código (funções, classes, variáveis) que pode ser importado e reutilizado em outros arquivos.' },
  { term:'Pacote', cat:'Python', def:'Conjunto de módulos organizados em diretórios, distribuído e instalado como uma unidade única.' },
  { term:'Ambiente Virtual (venv)', cat:'Python', def:'Ambiente isolado que permite instalar dependências específicas de um projeto sem afetar outros projetos no mesmo computador.' },
  { term:'pip', cat:'Python', def:'Gerenciador de pacotes padrão do Python, usado para instalar e gerenciar bibliotecas.' },
  { term:'Requests (biblioteca)', cat:'Python', def:'Biblioteca Python popular para fazer requisições HTTP de forma simples e legível.' },
  { term:'JSON', cat:'Python', def:'Formato leve de troca de dados, baseado em pares chave-valor, amplamente usado em APIs e configurações.' },
  { term:'Regex', cat:'Python', def:'Expressões regulares: padrões usados para buscar, validar ou substituir trechos de texto de forma flexível.' },
  { term:'NumPy', cat:'Python', def:'Biblioteca fundamental para computação numérica em Python, com suporte eficiente a arrays e operações matemáticas.' },
  { term:'Pandas', cat:'Python', def:'Biblioteca Python para manipulação e análise de dados tabulares, construída sobre o NumPy.' },
  { term:'DataFrame', cat:'Python', def:'Estrutura de dados bidimensional do Pandas, semelhante a uma planilha, usada para organizar e manipular dados tabulares.' },

  { term:'Git', cat:'Git', def:'Sistema de controle de versão distribuído que rastreia mudanças no código-fonte ao longo do tempo.' },
  { term:'GitHub', cat:'Git', def:'Plataforma online de hospedagem de repositórios Git, com recursos de colaboração como Pull Requests e Issues.' },
  { term:'Repositório', cat:'Git', def:'Diretório rastreado pelo Git que armazena o histórico completo de um projeto.' },
  { term:'Commit', cat:'Git', def:'Registro de uma alteração específica salva no histórico do repositório, acompanhada de uma mensagem descritiva.' },
  { term:'Branch', cat:'Git', def:'Linha de desenvolvimento independente dentro de um repositório, usada para trabalhar em uma funcionalidade sem afetar o código principal.' },
  { term:'Merge', cat:'Git', def:'Operação que combina as alterações de uma branch em outra.' },
  { term:'Pull Request', cat:'Git', def:'Solicitação formal para revisar e integrar as alterações de uma branch em outra, comum em fluxos colaborativos no GitHub.' },
  { term:'Fork', cat:'Git', def:'Cópia independente de um repositório em sua própria conta, usada para propor contribuições sem afetar o original.' },
  { term:'Clone', cat:'Git', def:'Cópia local completa de um repositório remoto, incluindo todo o seu histórico.' },
  { term:'Push', cat:'Git', def:'Envio das alterações commitadas localmente para um repositório remoto.' },
  { term:'Pull', cat:'Git', def:'Atualização do repositório local com as alterações mais recentes do repositório remoto.' },
  { term:'Conflito de Merge', cat:'Git', def:'Situação em que o Git não consegue combinar automaticamente alterações concorrentes no mesmo trecho de código.' },
  { term:'.gitignore', cat:'Git', def:'Arquivo que lista quais arquivos e pastas o Git deve ignorar e não rastrear no repositório.' },
  { term:'Commit Semântico', cat:'Git', def:'Convenção de mensagens de commit que segue um padrão (ex: feat, fix, docs) para facilitar o entendimento do histórico.' },
  { term:'Versionamento', cat:'Git', def:'Prática de registrar e gerenciar o histórico de mudanças de um projeto ao longo do tempo.' },

  { term:'API', cat:'APIs', def:'Interface de Programação de Aplicações: conjunto de regras que permite que diferentes sistemas se comuniquem entre si.' },
  { term:'REST', cat:'APIs', def:'Estilo arquitetural para construir APIs baseadas em recursos, usando os métodos padrão do protocolo HTTP.' },
  { term:'HTTP', cat:'APIs', def:'Protocolo de comunicação usado para transferir dados na web, base do funcionamento da maioria das APIs.' },
  { term:'Endpoint', cat:'APIs', def:'URL específica de uma API que representa um recurso ou ação disponível para ser consumida.' },
  { term:'Método GET', cat:'APIs', def:'Método HTTP usado para solicitar a leitura de um recurso, sem alterá-lo.' },
  { term:'Método POST', cat:'APIs', def:'Método HTTP usado para enviar dados ao servidor, geralmente para criar um novo recurso.' },
  { term:'JSON (em API)', cat:'APIs', def:'Formato padrão usado pela maioria das APIs modernas para estruturar os dados enviados e recebidos.' },
  { term:'Header', cat:'APIs', def:'Metadado enviado junto a uma requisição ou resposta HTTP, como tipo de conteúdo ou token de autenticação.' },
  { term:'Status Code', cat:'APIs', def:'Código numérico retornado por uma API indicando o resultado da requisição, como 200 (sucesso) ou 404 (não encontrado).' },
  { term:'Autenticação', cat:'APIs', def:'Processo de verificar a identidade de quem está fazendo uma requisição a uma API.' },
  { term:'API Key', cat:'APIs', def:'Chave secreta usada para identificar e autenticar um cliente ao consumir uma API.' },
  { term:'OAuth', cat:'APIs', def:'Protocolo de autorização que permite que aplicações acessem recursos em nome de um usuário sem expor sua senha.' },
  { term:'JWT', cat:'APIs', def:'JSON Web Token: formato compacto e assinado de token usado para transmitir informações de autenticação de forma segura.' },
  { term:'Rate Limit', cat:'APIs', def:'Limite de quantidade de requisições que um cliente pode fazer a uma API em um determinado período de tempo.' },
  { term:'Webhook', cat:'APIs', def:'Mecanismo em que um servidor notifica outro automaticamente quando um evento específico acontece.' },
  { term:'Latência', cat:'APIs', def:'Tempo decorrido entre o envio de uma requisição e o recebimento da resposta.' },
  { term:'Payload', cat:'APIs', def:'Conjunto de dados efetivamente transportado em uma requisição ou resposta de API.' },
  { term:'SDK', cat:'APIs', def:'Software Development Kit: conjunto de ferramentas e bibliotecas que facilita a integração com uma API ou plataforma.' },
  { term:'Streaming (API)', cat:'APIs', def:'Técnica de enviar a resposta de uma API em partes, à medida que são geradas, em vez de esperar o resultado completo.' },
  { term:'Idempotência', cat:'APIs', def:'Propriedade de uma operação que produz o mesmo resultado independentemente de quantas vezes for repetida.' },

  { term:'Deploy', cat:'Deploy', def:'Processo de disponibilizar uma aplicação em um ambiente de produção, acessível aos usuários finais.' },
  { term:'Docker', cat:'Deploy', def:'Plataforma que permite empacotar uma aplicação e suas dependências em containers portáveis e isolados.' },
  { term:'Container', cat:'Deploy', def:'Unidade leve e isolada que empacota uma aplicação com tudo o que ela precisa para rodar de forma consistente em qualquer ambiente.' },
  { term:'Imagem Docker', cat:'Deploy', def:'Modelo somente-leitura usado para criar containers, definido a partir de um Dockerfile.' },
  { term:'Dockerfile', cat:'Deploy', def:'Arquivo de texto com instruções para construir uma imagem Docker automaticamente.' },
  { term:'Docker Compose', cat:'Deploy', def:'Ferramenta para definir e executar aplicações Docker com múltiplos containers através de um único arquivo de configuração.' },
  { term:'Cloud Computing', cat:'Deploy', def:'Modelo de disponibilização de recursos computacionais (servidores, armazenamento) sob demanda através da internet.' },
  { term:'Variável de Ambiente', cat:'Deploy', def:'Valor de configuração definido fora do código-fonte, usado para armazenar dados sensíveis ou específicos do ambiente de execução.' },
  { term:'CI/CD', cat:'Deploy', def:'Integração e Entrega Contínuas: práticas que automatizam testes e deploy de código a cada alteração.' },
  { term:'Serverless', cat:'Deploy', def:'Modelo de execução em que o provedor de nuvem gerencia a infraestrutura automaticamente, cobrando apenas pelo uso real.' },
  { term:'Escalabilidade', cat:'Deploy', def:'Capacidade de um sistema suportar um aumento de carga (usuários ou dados) sem perda significativa de desempenho.' },
  { term:'Load Balancer', cat:'Deploy', def:'Componente que distribui o tráfego de requisições entre múltiplos servidores para evitar sobrecarga.' },
  { term:'Uptime', cat:'Deploy', def:'Percentual de tempo em que um sistema permanece disponível e operacional.' },
  { term:'Render', cat:'Deploy', def:'Plataforma de nuvem com camada gratuita, popular para fazer deploy rápido de aplicações web e APIs.' },
  { term:'Railway', cat:'Deploy', def:'Plataforma de nuvem com camada gratuita, focada em simplicidade para deploy de aplicações e bancos de dados.' },

  { term:'Viés Algorítmico', cat:'Ética & Segurança', def:'Distorção sistemática nos resultados de um algoritmo que gera tratamento injusto a determinados grupos.' },
  { term:'LGPD', cat:'Ética & Segurança', def:'Lei Geral de Proteção de Dados: legislação brasileira que regula a coleta, uso e armazenamento de dados pessoais.' },
  { term:'Privacidade de Dados', cat:'Ética & Segurança', def:'Princípio que garante o controle do indivíduo sobre como suas informações pessoais são coletadas e usadas.' },
  { term:'IA Responsável', cat:'Ética & Segurança', def:'Conjunto de práticas para desenvolver e usar IA de forma ética, transparente e segura para as pessoas.' },
  { term:'Prompt Injection (segurança)', cat:'Ética & Segurança', def:'Vulnerabilidade em que entradas maliciosas manipulam o comportamento pretendido de um sistema baseado em LLM.' },
  { term:'Data Leakage', cat:'Ética & Segurança', def:'Vazamento indevido de dados sensíveis, seja durante o treinamento do modelo ou durante seu uso em produção.' },

    const parsed = JSON.parse(raw);

    const merged = Object.assign({}, def, parsed);
    merged.favorites = Object.assign({}, def.favorites, parsed.favorites||{});

/* ============================================================
   GAMIFICATION
   ============================================================ */
function xpForLevel(level){ return Math.round(250 * Math.pow(level, 1.35)); }
function levelFromXp(xp){
  let lvl = 1;
  while(xp >= xpForLevel(lvl)) lvl++;
  return lvl;
}
function levelProgress(xp){
  const lvl = levelFromXp(xp);
  const prevReq = lvl===1? 0 : xpForLevel(lvl-1);
  const nextReq = xpForLevel(lvl);
  const pct = clamp(Math.round(((xp-prevReq)/(nextReq-prevReq))*100), 0, 100);
  return { level: lvl, pct, next: nextReq, cur: xp, prevReq };
}
function addXp(amount, reason){
  const before = levelFromXp(state.xp);
  state.xp += amount;
  const after = levelFromXp(state.xp);
  saveState();
  toast(reason || ('+'+amount+' XP'), { icon:'✨', title: '+'+amount+' XP' });
  if(after > before){
    setTimeout(()=> toast('Você alcançou o nível '+after+'!', { icon:'🏆', title:'Novo nível!', duration:4200 }), 400);
  }
  checkAchievements();
  refreshChrome();
}
function registerStudySeconds(sec){
  state.totalStudySeconds += sec;
  const day = todayISO();
  state.calendarLog[day] = (state.calendarLog[day]||0) + sec;
  updateStreak(day);
  saveState();
}
function updateStreak(day){
  if(state.lastStudyDate === day) return;
  if(state.lastStudyDate){
    const diff = daysBetween(state.lastStudyDate, day);
    state.streak = diff === 1 ? state.streak + 1 : (diff === 0 ? state.streak : 1);
  } else {
    state.streak = 1;
  }
  state.lastStudyDate = day;
  if(state.streak > state.bestStreak) state.bestStreak = state.streak;
}
function checkAchievements(){
  ACHIEVEMENTS.forEach(a => {
    if(!state.achievements.includes(a.id) && a.condition(state)){
      state.achievements.push(a.id);
      saveState();
      setTimeout(()=> toast(a.desc, { icon: a.icon, title: 'Conquista: '+a.title, duration: 4600 }), 600);
    }
  });
}
function toggleFavorite(cat, id){
  const arr = state.favorites[cat] || (state.favorites[cat] = []);
  const idx = arr.indexOf(id);
  if(idx>-1) arr.splice(idx,1); else arr.push(id);
  saveState();
}
function isFav(cat, id){ return (state.favorites[cat]||[]).includes(id); }

function markLessonComplete(lessonId){
  if(state.completedLessons.includes(lessonId)) return;
  state.completedLessons.push(lessonId);
  saveState();
  addXp(20, 'Aula concluída');
}
function unmarkLessonComplete(lessonId){
  state.completedLessons = state.completedLessons.filter(id => id!==lessonId);
  saveState();
  refreshChrome();
}
function moduleProgress(mod){
  if(!mod.lessons.length) return 0;
  const done = mod.lessons.filter(l => state.completedLessons.includes(l.id)).length;
  return Math.round((done/mod.lessons.length)*100);
}
function overallProgress(){
  if(!ALL_LESSONS.length) return 0;
  return Math.round((state.completedLessons.length / ALL_LESSONS.length) * 100);
}
function isModuleUnlocked(index){
  if(state.settings.freeNav) return true;
  if(index === 0) return true;
  const prev = MODULES[index-1];
  return moduleProgress(prev) === 100;
}

/* ============================================================
   ROUTER
   ============================================================ */
const routes = {};
const afterRenderHooks = {};
function parseHash(){
  const raw = (location.hash || '#/dashboard').slice(2);
  const [name, param] = raw.split('/');
  return [name||'dashboard', param ? decodeURIComponent(param) : undefined];
}
function navigate(hash){ if(location.hash === hash){ route(); } else { location.hash = hash; } }
function route(){
  closeStatusMenuPortal();
  const [name, param] = parseHash();
  const root = $('#view-root');
  const fn = routes[name] || routes.dashboard;
  try{
    root.innerHTML = fn(param);
  }catch(e){
    console.error('Erro ao renderizar view', name, e);
    root.innerHTML = '<div class="empty-state"><div class="es-icon">⚠️</div><p>Não foi possível carregar esta seção.</p></div>';
  }
  root.classList.remove('view-enter'); void root.offsetWidth; root.classList.add('view-enter');
  window.scrollTo({top:0, behavior:'auto'});
  updateBreadcrumb(name, param);
  renderSidebarNav();
  closeMobileMenu();
  const hook = afterRenderHooks[name];
  if(hook) hook(param);
  initTiltCards();
}
function updateBreadcrumb(name, param){
  const map = {
    dashboard:'Dashboard', roadmap:'Roadmap', modules:'Trilha de Módulos', module:'Módulo', lesson:'Aula',
    challenges:'Desafios', projects:'Projetos', library:'Biblioteca de Leitura', courses:'Cursos Gratuitos',
    playlists:'Playlists do YouTube', docs:'Documentação', books:'Livros Gratuitos', glossary:'Glossário',
    flashcards:'Flashcards', quizzes:'Quizzes', quiz:'Quiz', notes:'Anotações', certificate:'Certificado', settings:'Configurações'
  };
  let label = map[name] || 'Dashboard';
  if(name==='module' && MODULE_INDEX[param]) label = MODULE_INDEX[param].title;
  if(name==='lesson' && LESSON_INDEX[param]) label = LESSON_INDEX[param].title;
  if(name==='quiz' && MODULE_INDEX[param]) label = 'Quiz — '+MODULE_INDEX[param].title;
  $('#breadcrumb').innerHTML = '<span>IA para Devs</span><span style="opacity:.4;">/</span><b>'+escapeHtml(label)+'</b>';
}

function elFromHTML(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function initTiltCards(root){
  $$('.tilt-card', root||document).forEach(card => {
    if(card.dataset.tiltBound) return;
    card.dataset.tiltBound = '1';
    card.addEventListener('mousemove', e => {
      if(!state.settings.motion) return;
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left)/r.width - 0.5;
      const py = (e.clientY - r.top)/r.height - 0.5;
      card.style.transform = 'perspective(900px) rotateY('+(px*6)+'deg) rotateX('+(-py*6)+'deg) translateY(-2px)';
    });
    card.addEventListener('mouseleave', () => { card.style.transform=''; });
  });
}
function renderFlow(steps){
  if(!steps || !steps.length) return '';
  return '<div class="flow-diagram">' + steps.map((s,i) => '<div class="flow-step">'+escapeHtml(s)+'</div>' + (i<steps.length-1? '<span class="flow-arrow">→</span>':'')).join('') + '</div>';
}
function renderCodeBlock(code){
  if(!code) return '';
  return '<div class="code-block"><div class="code-head"><span>'+escapeHtml(code.lang||'código')+'</span><button class="btn btn-sm btn-ghost" data-action="copy-code" type="button">Copiar</button></div><pre>'+escapeHtml(code.text)+'</pre></div>';

function renderSidebarNav(){
  const [curName, curParam] = parseHash();
  const html = NAV_STRUCTURE.map(group => {
    let body = '';
    if(group.modules){
      body = MODULES.map((m, i) => {
        const unlocked = isModuleUnlocked(i);
        const prog = moduleProgress(m);
        const active = curName==='module' && curParam===m.id;
        return '<a class="nav-link '+(active?'active':'')+' '+(unlocked?'':'locked')+'" data-action="nav" data-href="#/module/'+m.id+'">'
          + '<span class="ic">'+m.icon+'</span><span>'+(i+1)+'. '+escapeHtml(m.title)+'</span>'
          + (unlocked ? (prog===100? '<span class="done-check">✓</span>' : '<span class="badge-mini">'+prog+'%</span>') : '<span class="badge-mini">🔒</span>')
          + '</a>';
      }).join('');
    } else {
      body = group.items.map(it => {
        const active = ('#/'+curName) === it.href || (curName==='lesson' && it.href==='#/dashboard' ? false : false);
        return '<a class="nav-link '+((location.hash===it.href)?'active':'')+'" data-action="nav" data-href="'+it.href+'"><span class="ic">'+it.icon+'</span><span>'+it.label+'</span></a>';
      }).join('');
    }
    return '<div class="nav-group '+(group.open?'open':'')+'" data-group>'
      + '<div class="nav-group-title" data-action="toggle-group"><span>'+group.group+'</span><span class="chev">▸</span></div>'
      + '<div class="nav-group-body">'+body+'</div></div>';
  }).join('');
  $('#sidebar-nav').innerHTML = html;
}

function handleImportFile(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const parsed = JSON.parse(reader.result);
      const def = defaultState();
      state = Object.assign(def, parsed);
      state.favorites = Object.assign({}, def.favorites, parsed.favorites||{});
      state.settings = Object.assign({}, def.settings, parsed.settings||{});
      saveState(); buildIndices(); applyAccent(); refreshChrome(); route();
      toast('Progresso importado com sucesso!');
    }catch(err){ toast('Arquivo inválido ou corrompido.'); }
  };
  reader.readAsText(file);
}

/* ============================================================
   PARTICLES / SPOTLIGHT
   ============================================================ */
function initBgFx(){
  const canvas = $('#particles-canvas');
  const ctx = canvas.getContext('2d');
  let w,h,particles=[];
  function resize(){ w=canvas.width=innerWidth; h=canvas.height=innerHeight; }
  function reset(){
    const count = Math.min(65, Math.floor(innerWidth/24));
    particles = Array.from({length:count}, () => ({ x:Math.random()*w, y:Math.random()*h, vx:(Math.random()-0.5)*0.22, vy:(Math.random()-0.5)*0.22, r:Math.random()*1.5+0.7 }));
  }
  resize(); reset();
  window.addEventListener('resize', debounce(()=>{ resize(); reset(); }, 250));
  function tick(){
    if(state.settings.particles){
      ctx.clearRect(0,0,w,h);
      for(const p of particles){
        p.x+=p.vx; p.y+=p.vy;
        if(p.x<0||p.x>w) p.vx*=-1;
        if(p.y<0||p.y>h) p.vy*=-1;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fillStyle='rgba(140,120,255,0.55)'; ctx.fill();
      }
      for(let i=0;i<particles.length;i++) for(let j=i+1;j<particles.length;j++){
        const a=particles[i], b=particles[j], dx=a.x-b.x, dy=a.y-b.y, dist=Math.hypot(dx,dy);
        if(dist<115){ ctx.strokeStyle='rgba(124,92,255,'+(0.14*(1-dist/115))+')'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); }
      }
    } else { ctx.clearRect(0,0,w,h); }
    requestAnimationFrame(tick);
  }
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){ state.settings.motion=false; }
  requestAnimationFrame(tick);
  document.addEventListener('mousemove', debounce((e)=>{
    document.documentElement.style.setProperty('--mx', e.clientX+'px');
    document.documentElement.style.setProperty('--my', e.clientY+'px');
  }, 12));
}
function applyAccent(){
  const map = {
    violet: ['#7c5cff','#22d3ee'], emerald: ['#34d399','#22d3ee'], sunset: ['#ff7a59','#fbbf24'], royal: ['#6366f1','#a855f7']
  };
  const [a1,a2] = map[state.settings.accent] || map.violet;
  document.documentElement.style.setProperty('--accent-1', a1);
  document.documentElement.style.setProperty('--accent-2', a2);

/* ============================================================
   SESSION TIMER — timer de estudo supervisionado (30/60/90/120min)
   ============================================================ */
let timerInterval = null;
function fmtCountdown(ms){
  const totalSec = Math.max(0, Math.round(ms/1000));
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  return (h>0? String(h).padStart(2,'0')+':':'') + String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function startStudyTimer(minutes){
  state.timer = { endAt: Date.now() + minutes*60000, totalMinutes: minutes, paused:false, pausedRemainingMs:null };
  saveState();
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(runTimerTick, 1000);
  updateTimerBtn();
  renderTimerModalContent();
}
function pauseStudyTimer(){
  if(!state.timer || state.timer.paused) return;
  state.timer.pausedRemainingMs = state.timer.endAt - Date.now();
  state.timer.paused = true;
  saveState();
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  updateTimerBtn();
  renderTimerModalContent();
}
function resumeStudyTimer(){
  if(!state.timer || !state.timer.paused) return;
  state.timer.endAt = Date.now() + (state.timer.pausedRemainingMs || 0);
  state.timer.paused = false;
  state.timer.pausedRemainingMs = null;
  saveState();
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(runTimerTick, 1000);
  updateTimerBtn();
  renderTimerModalContent();
}
function cancelStudyTimer(){
  state.timer = null;
  saveState();
  if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  updateTimerBtn();
  renderTimerModalContent();
}
function runTimerTick(){
  if(!state.timer){ updateTimerBtn(); return; }
  const remainingMs = state.timer.endAt - Date.now();
  if(remainingMs <= 0){
    const mins = state.timer.totalMinutes;
    state.timer = null;
    saveState();
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
    updateTimerBtn();
    renderTimerModalContent();
    addXp(Math.max(5, Math.round(mins/3)), 'Sessão de estudo de '+mins+' min concluída');
    toast('Você concluiu uma sessão de '+mins+' minutos de estudo focado. Ótimo trabalho!', { icon:'⏱️', title:'Tempo esgotado!', duration:5200 });
    if(window.Notification && Notification.permission === 'granted'){
      try{ new Notification('Sessão de estudo concluída', { body: 'Você completou '+mins+' minutos de estudo focado.' }); }catch(e){}
    }
    return;
  }
  updateTimerBtn();
  renderTimerModalContent();
}
function updateTimerBtn(){
  const btn = $('#timer-btn');
  if(!btn) return;
  if(state.timer){
    const remainingMs = state.timer.paused ? state.timer.pausedRemainingMs : (state.timer.endAt - Date.now());
    btn.className = 'streak-pill';
    btn.innerHTML = '⏱️ ' + fmtCountdown(remainingMs) + (state.timer.paused ? ' ⏸' : '');
  } else {

function studyMinutesInRange(days){
  let total = 0; const now = new Date();
  for(let i=0;i<days;i++){
    const d = new Date(now); d.setDate(d.getDate()-i);
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    total += (state.calendarLog[key]||0);
  }
  return Math.round(total/60);
}
function buildHeatmapCells(days){
  const now = new Date(); const cells = [];
  for(let i=days-1;i>=0;i--){
    const d = new Date(now); d.setDate(d.getDate()-i);
    const key = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const min = Math.round((state.calendarLog[key]||0)/60);
    let lvl = 0;
    if(min>=60) lvl=4; else if(min>=30) lvl=3; else if(min>=15) lvl=2; else if(min>0) lvl=1;
    cells.push('<div class="cell" data-lvl="'+lvl+'" title="'+key+' · '+min+' min"></div>');
  }
  return cells.join('');
}

function simpleMarkdownInline(text){
  let html = escapeHtml(text);
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/`([^`]+)`/g, '<code class="md-code">$1</code>');
  return html;
}
