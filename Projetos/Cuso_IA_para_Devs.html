function renderQuizBlock(questions, quizId, withSubmit){
  const saved = state.quizScores[quizId];
  const qHtml = questions.map((q,qi) => {
    const answeredBefore = saved ? '1':'';
    return `<div class="quiz-q" data-correct="${q.correct}" ${answeredBefore?'data-answered="1"':''}>
      <div class="q-text">${qi+1}. ${escapeHtml(q.q)}</div>
      ${q.options.map((opt,oi) => `<div class="quiz-opt ${answeredBefore? (oi===q.correct?'correct':''):''}" data-action="select-quiz-opt" data-idx="${oi}">${escapeHtml(opt)}</div>`).join('')}
      <div class="quiz-explain ${answeredBefore?'show':''}">💡 ${escapeHtml(q.explain)}</div>
    </div>`;
  }).join('');
  return `<div data-quiz-id="${quizId}">
    <div class="quiz-progress-count text-sm text-tertiary mb-16">${saved? 'Resultado salvo: '+saved.score+'/'+saved.total : questions.length+' pergunta(s)'}</div>

}

const STATUS_LABELS = { 'nao-iniciado':'Não iniciado', 'em-andamento':'Em andamento', 'concluido':'Concluído' };
function renderStatusDropdown(id, kind, status){
  return `<button type="button" class="status-trigger" data-action="toggle-status-menu" data-id="${id}" data-kind="${kind}" data-status="${status}">
    <span class="status-dot status-${status}"></span>
    <span>${STATUS_LABELS[status]}</span>
    <span class="chev">▾</span>
  </button>`;
}
function openStatusMenuPortal(triggerEl){
  const portal = $('#status-menu-portal');
  const alreadyOpenForThis = portal.classList.contains('open') && portal.dataset.openId === triggerEl.dataset.id;
  closeStatusMenuPortal();
  if(alreadyOpenForThis) return;
  const id = triggerEl.dataset.id, kind = triggerEl.dataset.kind, status = triggerEl.dataset.status;
  portal.innerHTML = Object.keys(STATUS_LABELS).map(st =>
    `<button type="button" class="status-option ${st===status?'active':''}" data-action="set-project-status" data-id="${id}" data-status="${st}" data-kind="${kind}"><span class="status-dot status-${st}"></span>${STATUS_LABELS[st]}</button>`
  ).join('');
  const rect = triggerEl.getBoundingClientRect();
  portal.style.left = rect.left + 'px';
  portal.style.width = rect.width + 'px';
  portal.style.top = (rect.bottom + 6) + 'px';
  portal.classList.add('open');
  portal.dataset.openId = id;
  triggerEl.classList.add('menu-open');
  requestAnimationFrame(() => {
    const pr = portal.getBoundingClientRect();
    if(pr.bottom > innerHeight - 8){ portal.style.top = Math.max(8, rect.top - pr.height - 6) + 'px'; }
    if(pr.right > innerWidth - 8){ portal.style.left = Math.max(8, innerWidth - pr.width - 8) + 'px'; }
  });
}
function closeStatusMenuPortal(){
  const portal = $('#status-menu-portal');
  portal.classList.remove('open');
  portal.dataset.openId = '';
  $$('.status-trigger.menu-open').forEach(t => t.classList.remove('menu-open'));
}

/* ============================================================
   FLASHCARDS
   ============================================================ */
const LEITNER_INTERVALS = [0,1,2,4,7,14,30];
function isCardDue(term){
  const rec = state.flashcards[term];
  if(!rec) return true;
  return rec.due <= todayISO();
}
function startFlashSession(onlyDue){
  const pool = GLOSSARY.map(g=>g.term);
  const due = pool.filter(isCardDue);
  const queue = (onlyDue===false) ? pool.slice() : (due.length? due : pool.slice());
  for(let i=queue.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [queue[i],queue[j]]=[queue[j],queue[i]]; }
  flashSession = { queue, idx: 0, revealed: false, onlyDue: onlyDue!==false };
}
function renderFlashcards(){
  return `
  <div class="page-head">
    <div class="eyebrow">🗂️ Repetição espaçada</div>
    <h1 class="page-title">Flashcards</h1>
    <p class="page-sub">Sistema de revisão baseado no método Leitner. Cards errados voltam mais rápido; cards fáceis se espaçam automaticamente.</p>
  </div>
  <div class="flex gap-16 flex-wrap mb-16">
    <div class="stat-tile" style="flex:1;min-width:160px;"><div class="stat-value">${state.flashcardHistory.reviewed}</div><div class="stat-label">Cards revisados</div></div>
    <div class="stat-tile" style="flex:1;min-width:160px;"><div class="stat-value">${state.flashcardHistory.reviewed? Math.round(state.flashcardHistory.correct/state.flashcardHistory.reviewed*100):0}%</div><div class="stat-label">Taxa de acerto</div></div>
    <div class="stat-tile" style="flex:1;min-width:160px;"><div class="stat-value">${GLOSSARY.map(g=>g.term).filter(isCardDue).length}</div><div class="stat-label">Cards pendentes hoje</div></div>
  </div>
  <div id="flash-stage"></div>`;
}
function renderFlashCardUI(){
  const stage = $('#flash-stage');
  if(!stage) return;
  if(!flashSession || flashSession.idx >= flashSession.queue.length){
    stage.innerHTML = `<div class="card empty-state" style="padding:50px;">
      <div class="es-icon">🎉</div>
      <h3 style="margin-bottom:8px;">Sessão concluída!</h3>
      <p class="mb-16">Você revisou todos os cards ${flashSession&&flashSession.onlyDue?'pendentes de hoje':'da sessão'}.</p>
      <div class="flex gap-12" style="justify-content:center;">
        <button class="btn btn-primary" data-action="flash-start" data-mode="due">Revisar pendentes</button>
        <button class="btn btn-outline" data-action="flash-start" data-mode="all">Revisar todos os ${GLOSSARY.length} termos</button>
      </div>
    </div>`;
    return;
  }
  const term = flashSession.queue[flashSession.idx];
  const g = GLOSSARY.find(x=>x.term===term);
  const pos = flashSession.idx+1, total = flashSession.queue.length;
  stage.innerHTML = `
  <div class="card tilt-card" style="padding:40px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
    <span class="badge badge-neutral mb-16" style="margin-bottom:16px;">${pos} / ${total}</span>
    <h2 style="font-size:26px;margin-bottom:16px;">${escapeHtml(g.term)}</h2>
    <div class="flash-back ${flashSession.revealed?'show':''}" style="max-width:560px;">
      <p class="text-secondary" style="font-size:15px;">${escapeHtml(g.def)}</p>
      <span class="badge badge-accent mt-16" style="margin-top:16px;">${escapeHtml(g.cat)}</span>
    </div>
    ${!flashSession.revealed? `<button class="btn btn-primary mt-24" style="margin-top:24px;" data-action="flash-reveal">Mostrar definição</button>` : ''}
  </div>
  ${flashSession.revealed ? `<div class="flex gap-12 mt-16" style="justify-content:center;">
    <button class="btn btn-outline" data-action="flash-answer" data-term="${encodeURIComponent(term)}" data-grade="again">😵 Errei</button>
    <button class="btn btn-outline" data-action="flash-answer" data-term="${encodeURIComponent(term)}" data-grade="hard">🤔 Difícil</button>
    <button class="btn btn-outline" data-action="flash-answer" data-term="${encodeURIComponent(term)}" data-grade="good">🙂 Bom</button>
    <button class="btn btn-outline" data-action="flash-answer" data-term="${encodeURIComponent(term)}" data-grade="easy">😎 Fácil</button>
  </div>` : ''}`;
}
function handleFlashAnswer(termEnc, grade){
  const term = decodeURIComponent(termEnc);
  const rec = state.flashcards[term] || { box: 0, reps: 0 };
  if(grade==='again') rec.box = 0;
  else if(grade==='hard') rec.box = Math.max(0, rec.box-1);
  else if(grade==='good') rec.box = Math.min(6, rec.box+1);
  else if(grade==='easy') rec.box = Math.min(6, rec.box+2);
  rec.reps = (rec.reps||0)+1;
  const d = new Date(); d.setDate(d.getDate() + LEITNER_INTERVALS[rec.box]);
  rec.due = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  state.flashcards[term] = rec;
  state.flashcardHistory.reviewed++;
  if(grade!=='again') state.flashcardHistory.correct++;
  saveState();
  flashSession.idx++;
  flashSession.revealed = false;
  renderFlashCardUI();
  refreshChrome();
}
ACTIONS['flash-start'] = (el) => { startFlashSession(el.dataset.mode!=='all'); renderFlashCardUI(); };
